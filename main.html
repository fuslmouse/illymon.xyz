<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>.</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      max-width: 100%;
      max-height: 100%;
    }

    .overlay-text {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: sans-serif;
      font-size: 2.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://i.pinimg.com/originals/86/6f/c1/866fc1b6d406f7809cc369b54f5f165f.gif" alt="">
    <div class="overlay-text">Under development</div>
  </div>
</body>
</html>
